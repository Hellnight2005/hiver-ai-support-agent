[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hiver-sde-intern"
version = "0.1.0"
description = "Grounded AI Customer Support Agent with Deterministic Escalation and Evaluation Harness"
authors = [{ name = "SDE Intern Candidate" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0",
    "duckdb>=0.9.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "scikit-learn>=1.3.0",
    "sentence-transformers>=2.2.2",
    "numpy>=1.24.0",
    "pytest>=7.4.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.65.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
